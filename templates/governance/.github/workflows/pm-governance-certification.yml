name: PM Governance Certification

on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Governance change classification
    runs-on: ubuntu-latest
    outputs:
      governance_changed: ${{ steps.classify.outputs.governance_changed }}
      trusted_context: ${{ steps.classify.outputs.trusted_context }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            FORK="${{ github.event.pull_request.head.repo.fork }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BASE="${{ github.event.merge_group.base_sha }}"
            HEAD="${{ github.event.merge_group.head_sha }}"
            FORK="false"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            HEAD="$(git rev-parse HEAD)"
            FORK="false"
          fi

          git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt || true
          cat /tmp/changed.txt

          if grep -Eq \
            '^(project-management/PM_AGENT\.md|project-management/GOVERNANCE\.md|project-management/policies/|project-management/AGENT_REGISTRY\.md|evaluators/|scripts/run_governance_evals\.py|scripts/generate_governance_certification\.py|scripts/pm_governance_benchmark_v1\.jsonl|\.claude/)' \
            /tmp/changed.txt; then
            echo "governance_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "governance_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$FORK" == "true" ]]; then
            echo "trusted_context=false" >> "$GITHUB_OUTPUT"
          else
            echo "trusted_context=true" >> "$GITHUB_OUTPUT"
          fi

  governance-certification:
    name: governance-certification
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 45

    # Required-check design:
    # The job always exists. For unrelated changes it exits successfully.
    # Governance changes require the full benchmark.
    steps:
      - name: No governance-sensitive changes
        if: needs.classify.outputs.governance_changed != 'true'
        run: |
          echo "No PM/governance/agent/evaluator-sensitive files changed."
          echo "Governance certification gate is a successful no-op."

      - name: Reject secret-bearing eval on untrusted fork
        if: needs.classify.outputs.governance_changed == 'true' && needs.classify.outputs.trusted_context != 'true'
        shell: bash
        run: |
          echo "::error::Governance-sensitive changes from an untrusted fork cannot run the secret-backed LangSmith benchmark in this workflow."
          echo "Use an approved trusted review/re-run process."
          exit 1

      - name: Checkout candidate
        if: needs.classify.outputs.governance_changed == 'true' && needs.classify.outputs.trusted_context == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: needs.classify.outputs.governance_changed == 'true' && needs.classify.outputs.trusted_context == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-evals.txt

      - name: Install evaluation dependencies
        if: needs.classify.outputs.governance_changed == 'true' && needs.classify.outputs.trusted_context == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-evals.txt

      - name: Verify required secrets are present
        if: needs.classify.outputs.governance_changed == 'true' && needs.classify.outputs.trusted_context == 'true'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LANGSMITH_API_KEY:-}" ]] || { echo "::error::LANGSMITH_API_KEY is missing"; exit 1; }
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo "::error::OPENAI_API_KEY is missing"; exit 1; }

      - name: Run PM governance benchmark
        if: needs.classify.outputs.governance_changed == 'true' && needs.classify.outputs.trusted_context == 'true'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOVERNANCE_DATASET_NAME: pm-governance-benchmark-v1
          GOVERNANCE_JUDGE_MODEL: openai:o3-mini
          GOVERNANCE_MIN_SEMANTIC_SCORE: '0.75'
          GOVERNANCE_EVAL_CONCURRENCY: '2'

          # Configure one of these for the real repository:
          PM_EVAL_RUNTIME: ${{ vars.PM_EVAL_RUNTIME }}
          PM_EVAL_TARGET: ${{ vars.PM_EVAL_TARGET }}
          PM_EVAL_COMMAND: ${{ vars.PM_EVAL_COMMAND }}
          PM_EVAL_REPO_ROOT: ${{ github.workspace }}

        run: |
          set -euo pipefail
          python scripts/run_governance_evals.py

      - name: Gate result
        if: always() && needs.classify.outputs.governance_changed == 'true'
        shell: bash
        run: |
          echo "PM Governance Certification check completed."
